# Builds a signed Unutma APK on GitHub's computers.
#
# - Push a tag like v1.2.0  -> builds the APK and publishes it as a GitHub release.
# - "Run workflow" button on the Actions tab -> builds a test APK only (download it from the run page).
#
# The signing key comes from the repo's Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the .jks file as base64 text
#   KEYSTORE_PASSWORD  the key store password
#   KEY_ALIAS          the key's alias (Android Studio's default is key0)
#   KEY_PASSWORD       the key's password
name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$name" ]; then
            echo "::error::Tag v$tag doesn't match versionName $name in app/build.gradle.kts"
            exit 1
          fi

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unutma.jks"

      - name: Build the release APK
        env:
          UNUTMA_KEYSTORE_FILE: ${{ runner.temp }}/unutma.jks
          UNUTMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UNUTMA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UNUTMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Unutma-$name.apk"

      - name: Keep the APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Unutma-apk
          path: out/*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Unutma ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
          make_latest: true

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/unutma.jks"
